[package]
name = "meguviz_native"
version = "0.1.0"
edition = "2021"
description = "High-speed Rust/PyO3/Rayon Zero-PII & CharLM frontend for MeguvizCAC v1.6.x+"

[lib]
name = "_meguviz_rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.24", features = ["extension-module"] }
numpy = "0.24"
rayon = "1.10"
regex = "1.11"
unicode-normalization = "0.1"
ahash = "0.8"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
